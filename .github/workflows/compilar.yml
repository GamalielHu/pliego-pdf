name: Compilar Pliego para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund 2>&1 | tee registro-instalar.txt

      - name: Copiar librerías e idiomas del OCR
        run: npm run vendor 2>&1 | tee registro-vendor.txt

      - name: Crear instalador y versión portable
        id: build
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee registro-compilar.txt
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Subir los .exe
        uses: actions/upload-artifact@v4
        with:
          name: Pliego-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publicar el .exe como versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.exe --title "Pliego $TAG" --notes "Instalador y versión portable para Windows." --latest

      - name: Guardar el registro si algo falla
        if: failure()
        run: |
          git config user.name "compilador"
          git config user.email "compilador@users.noreply.github.com"
          git checkout --orphan registro
          git rm -rf --cached . > /dev/null
          git add -f registro-*.txt
          git commit -m "Registro de compilación ${{ github.run_number }}"
          git push -f origin registro
